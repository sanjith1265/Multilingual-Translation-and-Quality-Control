[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incubrix"
version = "0.1.0"
description = "Multilingual Translation with Independent Quality Control - IncuBrix Track 04"
authors = [
    { name = "Sanjith", email = "candidate@incubrix.local" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
    "sacrebleu>=2.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "langdetect>=1.0.9",
    "openpyxl>=3.1.2",
    "tabulate>=0.9.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0"
]

[project.scripts]
incubrix = "incubrix.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
